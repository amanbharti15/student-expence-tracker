<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Student Expense Tracker</h1>

        <p>Manage your expenses</p>

        <button id="logoutBtn">Logout</button>

    </header>


    <main>

        <div class="dashboard">

            <h2>Dashboard</h2>


            <!-- Dashboard Cards -->

            <div class="cards">

                <div class="card">

                    <h3>Monthly Budget</h3>

                    <p id="budget">₹0</p>

                </div>


                <div class="card">

                    <h3>Total Spent</h3>

                    <p id="totalSpent">₹0</p>

                </div>


                <div class="card">

                    <h3>Remaining</h3>

                    <p id="remaining">₹0</p>

                </div>

            </div>


            <!-- Monthly Budget -->

            <div class="budget-section">

                <h2>Set Monthly Budget</h2>

                <form id="budgetForm">

                    <input
                        type="number"
                        id="budgetInput"
                        placeholder="Enter monthly budget"
                        min="1"
                        required
                    >

                    <button type="submit">
                        Set Budget
                    </button>

                </form>

            </div>


            <!-- Add Expense -->

            <div class="expense-section">

                <h2>Add Expense</h2>

                <form id="expenseForm">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        required
                    >


                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Grocery">
                            Grocery
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Hostel/Rent">
                            Hostel/Rent
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="What did you spend on?"
                    >


                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                        readonly
                    >


                    <button type="submit">
                        Add Expense
                    </button>

                </form>

            </div>


            <!-- Expense Calendar -->

            <div class="calendar-section">

                <h2>Expense Calendar</h2>

                <input
                    type="date"
                    id="calendarDate"
                >


                <div id="dailyExpense">

                    <p>
                        Select a date to see expenses.
                    </p>

                </div>

            </div>
<!-- Expense History -->

<div class="history-section">

    <h2>Expense History</h2>
    <div class="history-filter">

    <input
        type="text"
        id="searchExpense"
        placeholder="Search expense..."
    >

    <select id="filterCategory">

        <option value="All">
            All Categories
        </option>

        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Grocery">Grocery</option>
        <option value="Education">Education</option>
        <option value="Hostel/Rent">Hostel/Rent</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>

    </select>

</div>

    <div id="expenseHistory">

        <p>No expenses found.</p>

    </div>

</div>

        </div>

    </main>


    <footer>

        <p>© 2026 Student Expense Tracker</p>

    </footer>


    <script type="module" src="dashboard.js"></script>

</body>

</html>
