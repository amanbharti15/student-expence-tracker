<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="home-page">

    <div class="home-container">

        <div class="login-box">

            <h1>Student Expense Tracker</h1>

            <p class="subtitle">
                Manage your money. Track your expenses.
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>


    <script type="module" src="script.js"></script>

</body>

</html>
